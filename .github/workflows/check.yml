name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: sqlite+aiosqlite:///./.pytest_tmp/test.db

      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
      DB_HOST: localhost
      DB_PORT: '5432'

      SECRET_KEY: test-secret
      ALGORITHM: HS256

      REDIS_URL: redis://localhost:6379

      S3_KEY_ID: dummy
      S3_SECRET_KEY: dummy
      S3_BUCKET_NAME: dummy

      FORCE_DEVICE: cpu

      LOG_LEVEL: DEBUG
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare SQLite file
        run: mkdir -p .pytest_tmp && rm -f .pytest_tmp/test.db
      - name: Init SQLite
        run: |
            python - <<'PY'
            import asyncio
            from app.core.database import engine, Base
            from app.users import models as _users_models
            from app.pictures import models as _pictures_models
            
            async def main():
                if engine.url.get_backend_name() == "sqlite":
                    async with engine.begin() as conn:
                        await conn.run_sync(Base.metadata.create_all)
            
            asyncio.run(main())
            PY
      - name: Run tests
        run: pytest