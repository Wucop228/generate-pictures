[pytest]
addopts = -q
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3\.13:DeprecationWarning:passlib\.utils
    ignore:Failed to load image Python extension:UserWarning
    ignore:The torchvision\.datapoints.*:UserWarning
    ignore:The torchvision\.transforms\.v2.*:UserWarning
markers =
    unit: быстрые юнит-тесты без IO
    integration: тесты с локальными зависимостями (sqlite, moto, fakeredis)
    e2e: тесты через TestClient/весь стек